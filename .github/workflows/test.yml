name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (frontend + Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # `npm run lint` includes typecheck plus all frontend tests
      # (vitest unit tests, base-path, PWA service-worker, metadata cover security).
      - name: Lint & test frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build:all

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'

      - name: Download Go dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -v -timeout 10m

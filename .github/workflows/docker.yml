name: Build and Push Multi-Arch Image (GHCR)

on:
  workflow_dispatch:
  # Build only after the "Test" workflow passes on a push to main.
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    # Manual dispatch always builds. Otherwise, build only when the Test
    # workflow succeeded on a push to main (never on a pull_request test run).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    steps:
      # workflow_run triggers run against the default branch, so resolve the
      # exact commit that passed tests (head_sha) instead of the default SHA.
      - name: Resolve commit SHA
        id: commit
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo "${SHA}" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # 1. 拉代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      # 2. 启用 QEMU（支持 ARM 模拟）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 启用 Buildx（多架构构建核心）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录 GHCR（无需 secrets，自动用 GITHUB_TOKEN）
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 生成镜像标签
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nowen-reader
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.commit.outputs.short_sha }}

      # 6. 构建并推送（ARM + amd64）
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
